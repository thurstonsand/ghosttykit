name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      archive_version: ${{ steps.release.outputs.archive_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      npm_version: ${{ steps.release.outputs.npm_version }}
      npm_dist_tag: ${{ steps.release.outputs.npm_dist_tag }}
      mirror_tag: ${{ steps.release.outputs.mirror_tag }}
      mirror_stable: ${{ steps.release.outputs.mirror_stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail

          version="$(scripts/check-release-notes.sh)"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in RELEASE.md and the npm packages"
              exit 1
            fi
            archive_version="${version}"
            release_tag="${GITHUB_REF_NAME}"
            npm_version="${version}"
            npm_dist_tag="latest"
            mirror_tag="${GITHUB_REF_NAME}"
            mirror_stable="true"
          else
            IFS=. read -r major minor patch <<<"${version}"
            # Nightlies must outrank the last stable release and never regress, so
            # claim the smallest version greater than it rather than guessing higher.
            base_version="${major}.${minor}.$((patch + 1))"

            short_sha="${GITHUB_SHA::7}"
            archive_version="${base_version}-dev-${GITHUB_RUN_ID}-${short_sha}"
            release_tag="nightly-${archive_version}"
            npm_version="${base_version}-nightly.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${short_sha}"
            npm_dist_tag="nightly"
            mirror_tag="nightly"
            mirror_stable="false"
          fi

          {
            echo "archive_version=${archive_version}"
            echo "release_tag=${release_tag}"
            echo "npm_version=${npm_version}"
            echo "npm_dist_tag=${npm_dist_tag}"
            echo "mirror_tag=${mirror_tag}"
            echo "mirror_stable=${mirror_stable}"
          } >> "${GITHUB_OUTPUT}"

  build-macos:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-26
            goarch: arm64
    name: Build (${{ matrix.name }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: go
          cache: false

      - name: Validate signing secrets
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          test -n "${APPLE_CODESIGN_IDENTITY}"
          test -n "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}"
          test -n "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          test -n "${APPLE_NOTARY_ISSUER_ID}"
          test -n "${APPLE_NOTARY_KEY}"
          test -n "${APPLE_NOTARY_KEY_ID}"

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Write notarization key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "${APPLE_NOTARY_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          {
            echo "APPLE_NOTARY_KEY_PATH=${key_path}"
            echo "APPLE_NOTARY_KEY_ID=${APPLE_NOTARY_KEY_ID}"
            echo "APPLE_NOTARY_ISSUER_ID=${APPLE_NOTARY_ISSUER_ID}"
          } >> "${GITHUB_ENV}"

      - name: Build release archive
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.archive_version }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: scripts/build-release-archive.sh

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghosttykit-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    strategy:
      fail-fast: true
      matrix:
        goarch: [amd64, arm64]
    name: Build (linux-${{ matrix.goarch }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: go
          cache: false

      - name: Build release archive
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.archive_version }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: scripts/build-release-archive.sh

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghosttykit-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [ci, resolve, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ghosttykit-*
          merge-multiple: true

      - name: Publish tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          scripts/extract-release-notes.sh "$TAG" > /tmp/ghosttykit-release-notes.md
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/ghosttykit-release-notes.md

      - name: Publish main release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --prerelease \
              --latest=false \
              --notes "Automated release for ${GITHUB_SHA}."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --prerelease \
              --latest=false \
              --notes "Automated release for ${GITHUB_SHA}."
          fi

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: [resolve, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ghosttykit-*
          merge-multiple: true

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thurstonsand/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          path: homebrew-tap

      - name: Update formula
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          ASSET_VERSION: ${{ needs.resolve.outputs.archive_version }}
        run: |
          set -euo pipefail

          darwin_arm64_sha="$(cut -d ' ' -f 1 dist/ghosttykit_*_darwin_arm64.zip.sha256)"
          linux_amd64_sha="$(cut -d ' ' -f 1 dist/ghosttykit_*_linux_amd64.zip.sha256)"
          linux_arm64_sha="$(cut -d ' ' -f 1 dist/ghosttykit_*_linux_arm64.zip.sha256)"

          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            formula="homebrew-tap/Formula/ghosttykit.rb"
            class_name="Ghosttykit"
            formula_version=""
            conflict_formula="ghosttykit-nightly"
            nightly_notice=""
          else
            formula="homebrew-tap/Formula/ghosttykit-nightly.rb"
            class_name="GhosttykitNightly"
            formula_version="${ASSET_VERSION}"
            conflict_formula="ghosttykit"
            nightly_notice='This formula tracks nightly builds from GhosttyKit main and may break.\n\n'
          fi

          cat > "${formula}" <<EOF
          class ${class_name} < Formula
            desc "Ghostty terminal companion toolkit"
            homepage "https://github.com/thurstonsand/ghosttykit"
          EOF
          if [[ -n "${formula_version}" ]]; then
            printf '  version "%s"\n' "${formula_version}" >> "${formula}"
          fi
          cat >> "${formula}" <<EOF
            license "MIT"

            on_macos do
              depends_on arch: :arm64

              on_arm do
                url "https://github.com/thurstonsand/ghosttykit/releases/download/${RELEASE_TAG}/ghosttykit_${ASSET_VERSION}_darwin_arm64.zip"
                sha256 "${darwin_arm64_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/thurstonsand/ghosttykit/releases/download/${RELEASE_TAG}/ghosttykit_${ASSET_VERSION}_linux_arm64.zip"
                sha256 "${linux_arm64_sha}"
              else
                url "https://github.com/thurstonsand/ghosttykit/releases/download/${RELEASE_TAG}/ghosttykit_${ASSET_VERSION}_linux_amd64.zip"
                sha256 "${linux_amd64_sha}"
              end
            end

            conflicts_with "${conflict_formula}", because: "both install gty"

            def install
              bin.install "bin/gty"
              return unless OS.mac?

              prefix.install "GhosttyKitD.app"
              bin.install_symlink prefix/"GhosttyKitD.app/Contents/MacOS/ghosttykitd" => "ghosttykitd"
            end

            service do
              run macos: [opt_prefix/"GhosttyKitD.app/Contents/MacOS/ghosttykitd"]
              keep_alive true
              working_dir var
              log_path var/"log/ghosttykitd.log"
              error_log_path var/"log/ghosttykitd.log"
            end

            def caveats
              notice = "${nightly_notice}"
              if OS.mac?
                notice + <<~EOS
                  Start Ghostty, then start the GhosttyKit daemon:

                    brew services start #{full_name}

                  On first start, macOS should ask for permission to let GhosttyKitD control Ghostty.
                  Grant access, then verify the install with:

                    gty doctor
                EOS
              else
                notice + <<~EOS
                  This installs the gty CLI only. The GhosttyKit daemon is macOS-only, so gty here
                  serves SSH sessions bridged from a macOS host by gty ssh.
                EOS
              end
            end

            test do
              assert_match "gty ${ASSET_VERSION} protocol=", shell_output("#{bin}/gty version")
              assert_match "ghosttykitd ${ASSET_VERSION}", shell_output("#{bin}/ghosttykitd --version") if OS.mac?
            end
          end
          EOF

          ruby -c "${formula}"
          brew style "${formula}"

      - name: Commit formula update
        working-directory: homebrew-tap
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          ASSET_VERSION: ${{ needs.resolve.outputs.archive_version }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula && [[ -z "$(git ls-files --others --exclude-standard Formula)" ]]; then
            echo "Formula is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula

          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            git commit -m "ghosttykit ${RELEASE_REF_NAME#v}"
          else
            git commit -m "ghosttykit-nightly ${ASSET_VERSION}"
          fi

          # A release pushes main and its tag together, so the nightly and stable runs can both
          # reach this point; each writes its own formula, so rebasing onto the other is clean.
          git pull --rebase --quiet
          git push

  publish-lua-mirrors:
    name: Publish Lua Mirrors
    needs: [ci, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SDK_REPO: thurstonsand/ghosttykit.lua
      NVIM_REPO: thurstonsand/ghosttykit.nvim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - parallel:
          - name: Split Lua SDK mirror branch
            run: git subtree split --prefix=sdk/lua -b publish/ghosttykit.lua

          - name: Split Neovim plugin mirror branch
            run: git subtree split --prefix=nvim -b publish/ghosttykit.nvim

      - parallel:
          - name: Push Lua SDK mirror main
            env:
              MIRROR_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
            run: |
              git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/${SDK_REPO}.git" publish/ghosttykit.lua:main

          - name: Push Neovim plugin mirror main
            env:
              MIRROR_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
            run: |
              git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/${NVIM_REPO}.git" publish/ghosttykit.nvim:main

      - parallel:
          - name: Push stable Lua SDK mirror tag
            if: needs.resolve.outputs.mirror_stable == 'true'
            env:
              MIRROR_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              MIRROR_TAG: ${{ needs.resolve.outputs.mirror_tag }}
            run: git push "https://x-access-token:${MIRROR_TOKEN}@github.com/${SDK_REPO}.git" "publish/ghosttykit.lua:refs/tags/${MIRROR_TAG}"

          - name: Push stable Neovim plugin mirror tag
            if: needs.resolve.outputs.mirror_stable == 'true'
            env:
              MIRROR_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              MIRROR_TAG: ${{ needs.resolve.outputs.mirror_tag }}
            run: git push "https://x-access-token:${MIRROR_TOKEN}@github.com/${NVIM_REPO}.git" "publish/ghosttykit.nvim:refs/tags/${MIRROR_TAG}"

          - name: Push nightly Lua SDK mirror tag
            if: needs.resolve.outputs.mirror_stable == 'false'
            env:
              MIRROR_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              MIRROR_TAG: ${{ needs.resolve.outputs.mirror_tag }}
            run: git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/${SDK_REPO}.git" "publish/ghosttykit.lua:refs/tags/${MIRROR_TAG}"

          - name: Push nightly Neovim plugin mirror tag
            if: needs.resolve.outputs.mirror_stable == 'false'
            env:
              MIRROR_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              MIRROR_TAG: ${{ needs.resolve.outputs.mirror_tag }}
            run: git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/${NVIM_REPO}.git" "publish/ghosttykit.nvim:refs/tags/${MIRROR_TAG}"

  publish-typescript-sdk:
    name: Publish TypeScript SDK
    needs: [ci, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: npm
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Set nightly package version
        if: github.ref_type == 'branch'
        run: npm version "${{ needs.resolve.outputs.npm_version }}" --no-git-tag-version

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --tag "${{ needs.resolve.outputs.npm_dist_tag }}"

  publish-pi-paste:
    name: Publish Pi paste
    needs: [resolve, publish-typescript-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: npm
    defaults:
      run:
        working-directory: pi/pi-paste
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Set nightly package version
        if: github.ref_type == 'branch'
        run: npm version "${{ needs.resolve.outputs.npm_version }}" --no-git-tag-version

      - name: Use matching GhosttyKit SDK
        env:
          SDK_VERSION: ${{ needs.resolve.outputs.npm_version }}
        run: |
          for _ in {1..120}; do
            if npm view "@thurstonsand/ghosttykit@${SDK_VERSION}" version >/dev/null 2>&1; then
              npm install "@thurstonsand/ghosttykit@${SDK_VERSION}" --save-exact --package-lock-only
              exit 0
            fi
            sleep 5
          done

          npm view "@thurstonsand/ghosttykit@${SDK_VERSION}" version


      - name: Install dependencies
        run: npm ci

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --tag "${{ needs.resolve.outputs.npm_dist_tag }}"
