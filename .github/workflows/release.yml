name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-26
            goarch: arm64
          - name: darwin-amd64
            runner: macos-26-intel
            goarch: amd64
    name: Build (${{ matrix.name }})
    needs: ci
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Validate signing secrets
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          test -n "${APPLE_CODESIGN_IDENTITY}"
          test -n "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}"
          test -n "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          test -n "${APPLE_NOTARY_ISSUER_ID}"
          test -n "${APPLE_NOTARY_KEY}"
          test -n "${APPLE_NOTARY_KEY_ID}"

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Write notarization key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "${APPLE_NOTARY_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          {
            echo "APPLE_NOTARY_KEY_PATH=${key_path}"
            echo "APPLE_NOTARY_KEY_ID=${APPLE_NOTARY_KEY_ID}"
            echo "APPLE_NOTARY_ISSUER_ID=${APPLE_NOTARY_ISSUER_ID}"
          } >> "${GITHUB_ENV}"

      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -z "${base_tag}" ]]; then
              base_version="0.0.0"
            else
              base_version="${base_tag#v}"
            fi
            echo "version=${base_version}-dev-${GITHUB_RUN_ID}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release archive
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: scripts/build-release-archive.sh

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ghosttykit-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ghosttykit-*
          merge-multiple: true

      - name: Publish tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

      - name: Publish main release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nightly
        run: |
          git tag --force "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --prerelease \
            --notes "Automated release for ${GITHUB_SHA}."

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ghosttykit-*
          merge-multiple: true

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: thurstonsand/homebrew-ghosttykit
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          short_sha="${RELEASE_SHA::7}"
          amd64_sha="$(cut -d ' ' -f 1 dist/ghosttykit_*_darwin_amd64.zip.sha256)"
          arm64_sha="$(cut -d ' ' -f 1 dist/ghosttykit_*_darwin_arm64.zip.sha256)"

          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            formula="homebrew-tap/Formula/ghosttykit.rb"
            class_name="Ghosttykit"
            release_tag="${RELEASE_REF_NAME}"
            asset_version="${RELEASE_REF_NAME#v}"
            formula_version="${RELEASE_REF_NAME#v}"
            conflict_formula="ghosttykit-nightly"
            nightly_notice=""
            nightly_spacer=""
          else
            formula="homebrew-tap/Formula/ghosttykit-nightly.rb"
            class_name="GhosttykitNightly"
            release_tag="nightly"
            base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -z "${base_tag}" ]]; then
              base_version="0.0.0"
            else
              base_version="${base_tag#v}"
            fi
            asset_version="${base_version}-dev-${RELEASE_RUN_ID}-${short_sha}"
            formula_version="${asset_version}"
            conflict_formula="ghosttykit"
            nightly_notice="      This formula tracks nightly builds from GhosttyKit main and may break."
            nightly_spacer=""
          fi

          cat > "${formula}" <<EOF
          class ${class_name} < Formula
            desc "Ghostty terminal companion toolkit"
            homepage "https://github.com/thurstonsand/ghosttykit"
            version "${formula_version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/thurstonsand/ghosttykit/releases/download/${release_tag}/ghosttykit_${asset_version}_darwin_arm64.zip"
                sha256 "${arm64_sha}"
              else
                url "https://github.com/thurstonsand/ghosttykit/releases/download/${release_tag}/ghosttykit_${asset_version}_darwin_amd64.zip"
                sha256 "${amd64_sha}"
              end
            end

            conflicts_with "${conflict_formula}", because: "both install gty and ghosttykitd"

            def install
              bin.install "bin/gty"
              prefix.install "GhosttyKitD.app"
              bin.install_symlink prefix/"GhosttyKitD.app/Contents/MacOS/ghosttykitd" => "ghosttykitd"
            end

            service do
              run [opt_prefix/"GhosttyKitD.app/Contents/MacOS/ghosttykitd"]
              keep_alive true
              working_dir var
              log_path var/"log/ghosttykitd.log"
              error_log_path var/"log/ghosttykitd.log"
            end

            def caveats
              <<~EOS
          ${nightly_notice}
          ${nightly_spacer}
                Start Ghostty, then start the GhosttyKit daemon:

                  brew services start #{full_name}

                On first start, macOS should ask for permission to let GhosttyKitD control Ghostty.
                Grant access, then verify the install with:

                  gty doctor
              EOS
            end

            test do
              assert_match "gty ${asset_version} protocol=", shell_output("#{bin}/gty version")
              assert_match "ghosttykitd 0.0.0-dev", shell_output("#{bin}/ghosttykitd --version")
            end
          end
          EOF

          ruby -c "${formula}"

      - name: Commit formula update
        working-directory: homebrew-tap
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula && [[ -z "$(git ls-files --others --exclude-standard Formula)" ]]; then
            echo "Formula is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula

          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            git commit -m "ghosttykit ${RELEASE_REF_NAME#v}"
          else
            base_tag="$(git -C .. describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -z "${base_tag}" ]]; then
              base_version="0.0.0"
            else
              base_version="${base_tag#v}"
            fi
            git commit -m "ghosttykit-nightly ${base_version}-dev-${RELEASE_RUN_ID}-${RELEASE_SHA::7}"
          fi

          git push
