name: Publish TypeScript Packages

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Resolve npm version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.npm-release.outputs.version }}
      dist_tag: ${{ steps.npm-release.outputs.dist_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve package version and dist-tag
        id: npm-release
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            dist_tag="latest"
          else
            base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -z "${base_tag}" ]]; then
              base_version="0.0.0"
            else
              base_version="${base_tag#v}"
            fi
            version="${base_version}-nightly.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${GITHUB_SHA::7}"
            dist_tag="nightly"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"

  publish-sdk:
    name: Publish TypeScript SDK
    needs: [ci, release]
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Set package version
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --tag "${{ needs.release.outputs.dist_tag }}"

  publish-pi-paste:
    name: Publish Pi paste
    needs: [ci, release, publish-sdk]
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: pi/pi-paste
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set package version
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version

      - name: Use matching GhosttyKit SDK
        run: npm install "@thurstonsand/ghosttykit@${{ needs.release.outputs.version }}" --save-exact --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --tag "${{ needs.release.outputs.dist_tag }}"
