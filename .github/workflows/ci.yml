name: CI

on:
  workflow_call:

permissions:
  contents: read

# hk manages git hooks and publishes no darwin/amd64 build, so installing it fails
# outright on the Intel runner. CI never commits, so skip it everywhere.
env:
  MISE_DISABLE_TOOLS: hk

jobs:
  go:
    name: Go (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-26
          - name: darwin-amd64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Cache Go dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/go/go.sum', 'cli/gty/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Check Go packages
        run: |
          mise run //sdk/go:fmt:check
          mise run //cli/gty:fmt:check
          mise run //sdk/go:lint
          mise run //cli/gty:lint
          mise run //sdk/go:test
          mise run //cli/gty:test
          mise run //cli/gty:build

  swift:
    name: Swift
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Cache Swift build products
        uses: actions/cache@v6
        with:
          path: daemon/ghosttykitd/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/ghosttykitd/Package.swift', 'daemon/ghosttykitd/Package.resolved') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-

      - parallel:
          - name: Check Swift formatting
            run: mise run //daemon/ghosttykitd:fmt:check

          - name: Lint Swift package
            run: mise run //daemon/ghosttykitd:lint

      - name: Test Swift package
        run: mise run //daemon/ghosttykitd:test

      - name: Build Swift package
        run: mise run //daemon/ghosttykitd:build

  lua-nvim:
    name: Lua / Neovim
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Cache Lua dependencies
        uses: actions/cache@v6
        with:
          path: |
            .luarocks
            .luals
          key: lua-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'sdk/lua/ghosttykit-scm-1.rockspec', 'nvim/ghosttykit.nvim-scm-1.rockspec') }}
          restore-keys: |
            lua-${{ runner.os }}-${{ runner.arch }}-

      - name: Check Lua and Neovim packages
        run: |
          mise run //sdk/lua:fmt:check
          mise run //sdk/lua:lint
          mise run //sdk/lua:typecheck
          mise run //sdk/lua:test
          mise run //sdk/lua:build
          mise run //nvim:fmt:check
          mise run //nvim:lint
          mise run //nvim:typecheck
          mise run //nvim:test
          mise run //nvim:build

  typescript-pi:
    name: TypeScript / Pi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/ts/package-lock.json', 'pi/pi-paste/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - parallel:
          - name: Check TypeScript SDK
            run: |
              mise run //sdk/ts:fmt:check
              mise run //sdk/ts:lint
              mise run //sdk/ts:typecheck
              mise run //sdk/ts:test

          - name: Check Pi paste
            run: |
              mise run //pi/pi-paste:fmt:check
              mise run //pi/pi-paste:lint
              mise run //pi/pi-paste:typecheck
              mise run //pi/pi-paste:build

  docs-actions:
    name: Docs / Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Check docs and automation config
        run: |
          mise run docs:fmt:check
          mise run docs:lint
          mise run actions:lint
          mise run renovate:lint
