name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install Pi package dependencies
        run: just install-deps-pi

      - name: Install Lua package dependencies
        run: |
          just install-deps-lua
          just install-deps-nvim

      - name: Run checks
        run: just check
