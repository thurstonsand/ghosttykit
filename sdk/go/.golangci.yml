version: "2"

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/thurstonsand/ghosttykit

linters:
  settings:
    govet:
      enable:
        - shadow
  enable:
    - govet
    - contextcheck
    - copyloopvar
    - errchkjson
    - errorlint
    - errname
    - gocritic
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
